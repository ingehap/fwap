[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic_ml"
version = "0.0.1"
description = "Machine-learning surrogate & inverse models for fwap borehole-acoustic dispersion (issue #22)."
readme = "README.md"
# torch>=2 wheels require 3.11+, and the fwap CI matrix runs 3.11/3.12.
requires-python = ">=3.11"
# Same MIT license as the fwap core (see ../LICENSE); inlined because a
# build backend may not read a file outside this project directory.
license = { text = "MIT" }
dependencies = [
    # Mirror fwap's intentional major-version upper-bound policy.
    "numpy>=1.22,<3",
    # In-repo sibling: `fwap` is satisfied by the editable core install
    # (`pip install -e .`) rather than fetched from an index.
    "fwap",
    # CPU wheels are installed explicitly in CI
    # (--index-url https://download.pytorch.org/whl/cpu); the cap mirrors
    # fwap's guard-against-the-next-major convention.
    "torch>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "mypy>=1.8,<2",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # long lines -- docstrings frequently exceed 88 cols
    "E741",  # ambiguous variable name -- common in math
    "B008",  # function call in default arg
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "E402"]

[tool.ruff.format]
quote-style = "double"
