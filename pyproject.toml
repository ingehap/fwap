[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fwap"
version = "0.4.0"
description = "Full-Waveform Acoustic Processing - Python implementation of the algorithms in Mari, Coppens, Gavin & Wicquart (1994), Full Waveform Acoustic Data Processing, Editions Technip."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Per-version classifiers cover the range CI actually exercises
    # (see ``.github/workflows/ci.yml``). 3.9 and 3.10 are declared
    # supported by ``requires-python`` but are not in the CI matrix;
    # dropping 3.9 is tracked in IMPROVEMENTS.md and docs/roadmap_old.m.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Upper bounds gate against major-version breaks (e.g. NumPy 2.0
    # dropped legacy aliases; SciPy 2.x will reorganise scipy.signal).
    # Bump the upper bound in a release commit after a smoke test.
    "numpy>=1.22,<3",
    "scipy>=1.8,<2",
    "matplotlib>=3.5,<4",
    # LAS / DLIS log I/O and SEG-Y waveform I/O are all first-class --
    # the fwap.io API and demos assume every format round-trips out of
    # the box.
    "lasio>=0.30,<1",
    "dlisio>=1.0,<2",
    "dliswriter>=1.0,<2",
    "segyio>=1.9,<2",
]

# Populates the PyPI sidebar once the package is published.
[project.urls]
Homepage = "https://github.com/ingehap/fwap"
Documentation = "https://github.com/ingehap/fwap/blob/main/README.md"
Repository = "https://github.com/ingehap/fwap"
Issues = "https://github.com/ingehap/fwap/issues"
Changelog = "https://github.com/ingehap/fwap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-benchmark>=4,<6",
    "pytest-cov>=4,<7",
    "hypothesis>=6,<7",
    "mypy>=1.8,<2",
    "ruff>=0.6,<1",
    # nbval re-executes the validation notebook in
    # ``docs/notebooks/cylindrical_biot_validation.ipynb`` and fails
    # on cell errors. Run with::
    #
    #     pytest --nbval-lax docs/notebooks/cylindrical_biot_validation.ipynb
    "nbval>=0.10,<1",
]
docs = [
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2,<4",
    "myst-nb>=1.0,<2",
    "ipykernel>=6,<7",
]

[project.scripts]
fwap = "fwap.cli:main"

[tool.mypy]
# Target the newest version CI exercises. The runtime floor is still
# 3.9 (see ``requires-python``), but mypy parses installed third-party
# stubs against this target, and modern deps ship stubs using syntax
# from newer Pythons -- numpy 2.5's ``__init__.pyi`` uses PEP 695
# ``type`` statements (3.12+), which abort the run under an older
# target. 3.9 is upstream-EOL and slated for removal, so aligning the
# mypy target with the CI matrix is the intended direction.
python_version = "3.12"
# Strict enough to catch real bugs, permissive enough to not demand
# stubs for every external call site.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# numpy / scipy / matplotlib / lasio / segyio ship partial or no
# stubs; ignore them globally so fwap-internal call sites still get
# checked. Ratcheting this further (per-module overrides + strict
# checking on fwap/*) is tracked as future work -- doing it cleanly
# requires backfilling a few dozen variable annotations first.
ignore_missing_imports = true

# matplotlib ships a ``py.typed`` marker as of 3.11, so
# ``ignore_missing_imports`` no longer stops mypy from *following* into
# its source -- and that source uses 3.10+ ``match`` syntax which our
# ``python_version = "3.9"`` target cannot parse, aborting the run with
# a spurious "[syntax]" error in ``matplotlib/_afm.py``. fwap only uses
# matplotlib in the demos / plotting helpers and never type-checks
# against it, so skip following it entirely (restores the pre-3.11
# behaviour the global ``ignore_missing_imports`` used to give).
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
# By default exclude the perf-regression suite: those assertions are
# wall-clock budgets tuned on a developer laptop, so they belong in
# the dedicated ``bench`` CI job, not every local ``pytest`` run.
# Run them explicitly with ``pytest tests/test_bench.py``.
addopts = "--ignore=tests/test_bench.py"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fwap*"]

[tool.setuptools.package-data]
fwap = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["docs/_build", "docs/generated", "docs/notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade -- PEP 604/585 modern type hints
]
ignore = [
    "E501",   # long lines -- docstrings frequently exceed 88 cols
    "E741",   # ambiguous variable name ("l", "I") -- common in math
    "E702",   # multiple statements on one line -- style choice,
              # used for lists like ``xs.append(x); src.append(j)``
    "B008",   # function call in default arg -- used for np.deg2rad(...)
    "B028",   # allow warnings.warn without stacklevel=2 (we set it
              # explicitly where needed)
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import inside functions and use wildcard helpers.
# B023 fires on closures that capture a loop variable and are called
# immediately within the same iteration (a benign pattern used by the
# brentq oracle blocks in test_cylindrical_solver.py); rewriting every
# such closure with a default-binding shim would be pure ceremony.
"tests/*" = ["F401", "F811", "E402", "B023"]
# __init__.py re-exports a lot, which ruff flags as unused imports;
# it also reorders the import block around module-level docstrings.
"fwap/__init__.py" = ["F401", "E402", "I001"]
# These modules declare module-level Literal type aliases or a
# hoisted ``logger`` between the imports and the functions, which
# ruff sees as imports below module-level code.
"fwap/attenuation.py" = ["E402"]
"fwap/dispersion.py" = ["E402"]
"fwap/picker.py" = ["E402"]
# io.py has module-level guarded imports that must stay below the
# _require_* helpers.
"fwap/io.py" = ["E402"]

[tool.ruff.format]
# Match the existing hand-formatted style where reasonable.
quote-style = "double"
