name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR / branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares `requires-python = ">=3.9"`, but 3.9 is past
        # upstream EOL (Oct 2025) and IMPROVEMENTS.md plans dropping it.
        # CI exercises the versions we actually intend to support; the 3.9
        # drop happens in its own PR.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # ipykernel provides the "python3" kernel nbval re-executes the
          # open-hole tutorials with (nbval itself ships in the [dev] extra).
          pip install ipykernel

      - name: Ruff lint
        run: ruff check fwap/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check fwap/ tests/ scripts/

      - name: Mypy
        run: mypy fwap

      - name: Public-API guard
        run: python scripts/check_public_api.py

      - name: Pytest
        # The bench suite is excluded by pyproject.toml's addopts.
        #
        # Coverage gate: the suite measured 96.5% line coverage over
        # ``fwap/`` (5799/6008 statements) when the gate was added.
        # ``--cov-fail-under=95`` leaves ~1.5 points of headroom for
        # version-gated branches that differ between 3.11 and 3.12,
        # so the gate catches real regressions without going red on
        # interpreter differences. Raise it as coverage improves.
        #
        # ``-n auto`` runs one worker per vCPU. **These runners have
        # two**, not four: both matrix jobs print ``created: 2/2
        # workers``. This comment claimed four until the first run was
        # read, which also makes the ceiling 2x rather than 4x -- do not
        # reason about this step's wall clock without that number.
        #
        # Two thirds of the serial time sits in ~50 root-finding tests,
        # so parallelism is the whole win here: no test got faster,
        # they stopped queueing behind each other.
        #
        # ``--dist loadfile`` keeps every test in a file on one worker.
        # Per-test would balance better, but it also lets two tests from
        # one module run at once, and that is a property this suite has
        # never had to hold. **Measured, on 4 cores forced to two
        # workers**: loadfile 324.8 s, load 305.2 s -- per-file costs
        # 6.4 %, and both pass 1526. Against 590 s serial that is 1.82x
        # and 1.93x, so at two workers the 2x ceiling is nearly
        # saturated either way and the safe choice is close to free.
        #
        # For reference on 4 cores: ``-n auto`` (4 workers) 213 s, a
        # 2.77x speedup; this exact command with coverage 325 s at
        # 96.10 % -- pytest-cov combines the workers, so the gate below
        # is unaffected.
        #
        # **The matrix jobs differ by more than the interpreter.** Same
        # command and same 2 workers gave 3.11 297.7 s and 3.12 496.4 s
        # in one run, while an earlier serial run gave 3.11 621 s and
        # 3.12 481 s -- a ~30-70 % spread whose sign is not stable. That
        # is runner hardware, not Python and not this configuration; a
        # single slow job here is not evidence of a regression.
        run: >-
          pytest -x -n auto --dist loadfile
          --cov=fwap --cov-report=term-missing --cov-fail-under=95

      - name: Validate open-hole tutorial notebooks (nbval)
        # These two use only fwap (no torch), so they belong in the core gate --
        # running them here also proves the tutorials work without the ML layer
        # installed. The sonic_ml tutorials are validated in ml.yml instead.
        run: |
          pytest --nbval-lax \
            docs/notebooks/open_hole_processing.ipynb \
            docs/notebooks/open_hole_petrophysics.ipynb
