name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR / branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares `requires-python = ">=3.9"`, but 3.9 is past
        # upstream EOL (Oct 2025) and IMPROVEMENTS.md plans dropping it.
        # CI exercises the versions we actually intend to support; the 3.9
        # drop happens in its own PR.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # ipykernel provides the "python3" kernel nbval re-executes the
          # open-hole tutorials with (nbval itself ships in the [dev] extra).
          pip install ipykernel

      - name: Ruff lint
        run: ruff check fwap/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check fwap/ tests/ scripts/

      - name: Mypy
        run: mypy fwap

      - name: Public-API guard
        run: python scripts/check_public_api.py

      - name: Pytest
        # The bench suite is excluded by pyproject.toml's addopts.
        #
        # Coverage gate: the suite measured 96.5% line coverage over
        # ``fwap/`` (5799/6008 statements) when the gate was added.
        # ``--cov-fail-under=95`` leaves ~1.5 points of headroom for
        # version-gated branches that differ between 3.11 and 3.12,
        # so the gate catches real regressions without going red on
        # interpreter differences. Raise it as coverage improves.
        #
        # ``-n auto`` runs one worker per vCPU (4 on ubuntu-latest).
        # Measured on a 4-core box, without coverage: 590 s serial ->
        # 213 s, a 2.77x speedup, 1526 passed either way. This exact
        # command, coverage included, lands at 325 s and still reports
        # 96.10% -- pytest-cov combines the workers' data, so the gate
        # below is unaffected.
        #
        # Two thirds of the serial time sits in ~50 root-finding tests,
        # so parallelism is the whole win here: no test got faster,
        # they stopped queueing behind each other. The floor is the
        # slowest single test (28 s), nowhere near binding yet.
        #
        # ``--dist loadfile`` keeps every test in a file on one worker.
        # The default per-test distribution would be better balanced,
        # but it also lets two tests from one module run at once, and
        # that is a property this suite has never had to hold. Per-file
        # is the conservative choice and there are enough files to fill
        # four workers. If the balance ever becomes the bottleneck,
        # measure before loosening it.
        run: >-
          pytest -x -n auto --dist loadfile
          --cov=fwap --cov-report=term-missing --cov-fail-under=95

      - name: Validate open-hole tutorial notebooks (nbval)
        # These two use only fwap (no torch), so they belong in the core gate --
        # running them here also proves the tutorials work without the ML layer
        # installed. The sonic_ml tutorials are validated in ml.yml instead.
        run: |
          pytest --nbval-lax \
            docs/notebooks/open_hole_processing.ipynb \
            docs/notebooks/open_hole_petrophysics.ipynb
